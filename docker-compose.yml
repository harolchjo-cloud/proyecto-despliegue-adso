services:
  db:
    image: mysql:8.4
    container_name: proyecto_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: proyecto_db
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - red_proyecto

  api:
    image: harolimpos/proyecto-api:latest
    container_name: proyecto_api
    restart: always
    environment:
      DB_HOST: db
      DB_USER: appuser
      DB_PASSWORD: apppass
      DB_NAME: proyecto_db
    depends_on:
      - db
    networks:
      - red_proyecto

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx_proxy_manager
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - red_proyecto

networks:
  red_proyecto:
    driver: bridge

volumes:
  db_data:
  npm_data:
  npm_letsencrypt:
